    <h1 class="main-title">JONAS RUBINEK</h1>
  </header>
  
  <main class="scroll-content-container">
    <div class="content-stack">
      
    

      <!-- Left-Aligned Information Blocks -->
      <div class="left-aligned-box">
        <h2 class="inner-page-title">Contact Jonas</h2>

        <p class="description-text">
          You can get in touch with me on <a href="https://substack.com/@writingcourage" target="_blank">Substack</a>, or <a href="https://@jonasrubinek.bsky.social" target="_blank">BlueSky</a> or by using the form below. I will reply to the e-mail supplied through the form.
        </p>

        <!-- WEB3FORMS FORM COMPONENT -->
            

<form action="https://://web3forms.com" method="POST" class="embedded-contact-form">

          
          <!-- CRITICAL: Paste your Web3Forms access key token inside the value field below -->
          <input type="hidden" name="access_key" value="a5d0c611-1f06-48ac-ab43-391cd7355247">

          <!-- OPTIONAL CUSTOMIZATION FIELDS (Web3Forms Feature Extensions) -->
          <!-- Sets custom subject header for incoming message notification emails -->
          <input type="hidden" name="subject" value="New Contact Inquiry from Jonas Rubinek Website">
          
          <!-- Anti-spam Honeypot Field (Kept invisible to humans, bots will fill it and get blocked) -->
          <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

          <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="Your Name" required>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Your e-mail" required>
          </div>

          <div class="form-group">
            <label for="message" class="form-label">Your Message</label>
            <textarea id="message" name="message" class="form-textarea" rows="5" placeholder="Your message" required></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>

              </div>

    </div>
  </main>
  
  </body>
